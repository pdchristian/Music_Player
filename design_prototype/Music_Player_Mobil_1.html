<head>

<title>BeatClip – Offline-Musik Player Mobil v1 · Interaktiver Prototyp</title>
<!--
  ============================================================================
  BeatClip v1 – INTERAKTIVER HTML-Prototyp (Simulation im Browser, kein Build)
  ----------------------------------------------------------------------------
  Konzept: Mobile App für lokal heruntergeladene Audiodateien.
  Kernidee: Jeder Titel in einer Playlist hat eigene CUT-PUNKTE (Start/Ende).
  Abgespielt wird nur der Abschnitt dazwischen – das Lied läuft nie komplett,
  sofern ein Schnitt gesetzt ist.

  Navigation (4 Bereiche + zentrale Aktion):
    1 ▸ START       Cockpit: „Läuft gerade“, letzte Playlists, zuletzt gespielt
    2 ▸ PLAYLISTEN  Playlists mit Titelanzahl + „geschnitten“-Badge, Drill-in
    3 ▸ BIBLIOTHEK  Alle lokalen Dateien (Suche, Import, Format/Größe)
    4 ▸ EINSTELL.  Wiedergabe, Ordner, Sleep-Timer, Hell/Dunkel
    ✂ FAB          „Schnitt setzen“ – öffnet den Schnitt-Editor für den
                   aktuellen Titel ( alternativ ✂ pro Playlistenzeile )
    Player         Vollbild-Drill-in (← zurück) mit Timeline + Cut-Anzeige
    Schnitt-Editor Bottom-Sheet mit WAVEFORM und zwei ziehbaren Griffen
                   (Start/Ende), Feinjustage ±1 s, Reset, Vorschau

  Interaktion im Prototyp: Play/Pause, Auto-Nächstertitel beim Erreichen der
  Endmarke, seek per Klick auf Timeline/Waveform, Griffe ziehen (Pointer),
  Playlist-Toggle (geschnitten an/aus), Toast, Bottom-Sheets, Dark/Light.

  Look & Feel folgt: C:\Python\WOL\design_prototype\Android_50.html und
                     C:\Python\Copilot_Chat\design_prototype\Mobile_Chat_51.html
  (gleiche Farbtokens DARK/LIGHT, Phone-Frame, Panels/Zeilen, Pills, Sheets,
  Toast, Bottom-Nav mit FAB, Event-Delegation über data-act)

  Öffnen: direkt im Browser (F12 → Handy-Emulation empfohlen).
  ============================================================================
-->
<style>

  .ctlBtn.on{border-color:var(--accent);color:var(--accent);background:rgba(0,184,169,.12)}
  .skipRow{display:flex;gap:8px;margin:16px 16px 0}

  .aboutBlock{text-align:center;padding:20px 10px 6px}

<div class="phone" id="phone" data-theme="dark">
  <div class="statusbar"><span id="clock">09:41</span><span>📶 &nbsp;🔋 86 %</span></div>

  <div class="screen active" id="s-home"></div>

<script>
"use strict";
/* ══════════════════════════ Utils ════════════════════════════════════════ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function mmss(sec, withHours){
  sec = Math.max(0, Math.round(sec*10)/10);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  const cs = Math.round((sec - Math.floor(sec))*10);
  const base = h > 0 || withHours
    ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${m}:${String(s).padStart(2,"0")}`;
  return base;
}
function mmssPrecise(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = Math.floor(sec%60), t = Math.round((sec%1)*10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${t}`;
}
function clockStr(){ const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function toast(msg, isErr){ const el = $("#toast"); el.textContent = msg;
  el.classList.toggle("err", !!isErr); el.classList.add("show");
  clearTimeout(el._tm); el._tm = setTimeout(() => el.classList.remove("show"), 2400); }
function timeAgo(ts){ const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return "gerade eben"; if (s < 3600) return Math.floor(s/60)+" min";
  if (s < 86400) return Math.floor(s/3600)+" h"; return Math.floor(s/86400)+" T"; }

/* Deterministische Pseudozufalls-Waveform (identisch je Titel-ID) */
function waveData(seedStr, n){
  let h = 2166136261;
  for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const out = [];
  let v = .45;
  for (let i = 0; i < n; i++){
    v = clamp(v + (rnd()-.5)*.34, .07, 1);
    const beat = (i % 12 < 2) ? .14 : 0;
    out.push(clamp(v + beat, .05, 1));
  }
  return out;
}

/* ══════════════════════════ Helpers: Tracks & Schnitte ═══════════════════ */
const track = id => state.tracks.find(t => t.id === id);
const playlist = id => state.playlists.find(p => p.id === id);
const itemOf = (plId, trackId) => playlist(plId)?.items.find(i => i.id === trackId);
/* Cut des aktuell spielenden Titels (aus der aktiven Queue-Playlist) */
function currentItem(){
  if (!state.player.trackId) return null;
  for (const pl of state.playlists){
    const it = pl.items.find(i => i.id === state.player.trackId);
    if (it) return { pl, it };
  }
  return null;
}
function activeCut(){ const c = currentItem(); return c ? c.it.cut : null; }
/* Effektiver Abspielbereich */
function span(){
  const t = track(state.player.trackId); if (!t) return null;
  const cut = activeCut();
  const start = cut ? cut.start : 0;
  const end   = cut ? Math.min(cut.end, t.dur) : t.dur;
  return { start, end, dur:t.dur, len:end-start };
}
function cutBadge(it){
  return it.cut
    ? `<span class="pill pillCut">✂ ${mmss(it.cut.end - it.cut.start)} von ${mmss(track(it.id).dur)}</span>`
    : `<span class="pill pillFull">ganz</span>`;
}

/* ══════════════════════════ Wiedergabe-Simulation ═══════════════════════ */
let beat = 0;           /* Animations-Tick 200 ms = 1 s Musikzeit */
function playTrack(trackId, plId){
  const t = track(trackId); if (!t) return;
  const pl = plId ? playlist(plId) : currentItem()?.pl;
  let it = pl ? pl.items.find(i => i.id === trackId) : null;
  if (!it){ /* Track ohne Playlist (Bibliothek) → temporärer Eintrag in „Alle Titel“ */
    const all = playlist("pl4");
    it = all.items.find(i => i.id === trackId);
    pl = all;
  }
  if (!it) return;
  state.playQueue = pl.items.map(i => i.id);
  state.qIndex = state.playQueue.indexOf(trackId);
  state.player.trackId = trackId;
  const cut = it.cut;
  state.player.pos = cut ? cut.start : 0;
  state.player.playing = true;
  renderMini(); refreshCurrent();
  if (state.screen !== "player") toast(`▶ ${t.title} · ${it.cut ? `Schnitt ${mmssPrecise(cut.start)}–${mmssPrecise(cut.end)}` : "ganzer Titel"}`);
}
function togglePlay(){
  if (!state.player.trackId){ playTrack(state.playlists[0].items[0].id, "pl1"); return; }
  state.player.playing = !state.player.playing;
  renderMini(); refreshCurrent();
}
function nextTrack(manual){
  const q = state.playQueue; if (!q.length) return;
  let idx = state.qIndex;
  if (state.settings.shuffle){
    idx = Math.floor(Math.random()*q.length);
  } else idx++;
  if (idx >= q.length){
    if (state.settings.repeat === "one" && !manual){ state.player.pos = span().start; renderMini(); refreshCurrent(); return; }
    idx = 0;
  }
  playTrack(q[idx]);
}
function prevTrack(){
  if (span() && state.player.pos - span().start > 3){ state.player.pos = span().start; renderMini(); refreshCurrent(); return; }
  let idx = state.qIndex - 1; if (idx < 0) idx = state.playQueue.length - 1;
  playTrack(state.playQueue[idx]);
}
/* Haupttick: 200 ms real = 1.0 s Musik (damit der Prototyp flott durchläuft) */
setInterval(() => {
  if (!state.player.playing || !state.player.trackId) return;
  beat++;
  const s = span(); if (!s) return;
  state.player.pos += 1.0;
  if (state.player.pos >= s.end){
    /* Ende des Schnitts erreicht → Übergang */
    if (state.settings.repeat === "one"){ state.player.pos = s.start; }
    else if (state.qIndex >= state.playQueue.length - 1 && state.settings.repeat === "off"){
      state.player.playing = false; state.player.pos = s.end;
      toast(`⏹ „${track(state.player.trackId).title}“ zu Ende (Schnitt)`);
      renderMini(); refreshCurrent(); return;
    } else {
      const done = track(state.player.trackId).title;
      nextTrack(false);
      toast(`↦ „${done}“ fertig · Schnitt-Ende bei ${mmssPrecise(s.end)}`);
      return;
    }
  }
  renderMini();
  if (state.screen === "player"){ drawPlayerTimeline(); updatePlayerText(); }
  if ($("#sheet").classList.contains("open") && state.ui.editTrack === state.player.trackId){
    drawSheetWave(); updateCutBoxes();
  }
}, 200);

function go(screen, push){
  if (push !== false && screen !== state.screen) state.stack.push(state.screen);
  state.screen = screen;
  $$(".screen").forEach(s => s.classList.remove("active"));
  $("#s-"+screen).classList.add("active");
  $$(".nav").forEach(n => n.classList.toggle("active", n.dataset.nav === (TABS.includes(screen) ? screen : null)));
  ({ home:renderHome, playlists:renderPlaylists, pl:renderPlDetail, library:renderLibrary,
     set:renderSet, player:renderPlayer, about:renderAbout })[screen]();
  $("#s-"+screen).scrollTop = 0;
}
function back(){ const prev = state.stack.pop() || "home"; go(prev, false); }
$$(".nav").forEach(n => n.addEventListener("click", () => go(n.dataset.nav, false)));
function refreshCurrent(){
  ({ home:renderHome, playlists:renderPlaylists, pl:renderPlDetail, library:renderLibrary,
     set:renderSet, player:renderPlayer, about:renderAbout })[state.screen]?.();
}

function bindTimeline(){
  const tl = $("#pTimeline");

    } else {

document.addEventListener("pointermove", e => {
  const d = state.ui.drag; if (!d) return;
  const host = d.scope === "player" ? $("#pTimeline") : $("#wWaveWrap");
  if (!host) return;
  const wrap = host.querySelector("canvas").parentElement;
  const r = wrap.getBoundingClientRect();
  const frac = clamp((e.clientX - r.left) / r.width, 0, 1);
  const t = track(d.trackId);
  const sec = Math.round(frac * t.dur * 10) / 10;
  const it = itemOf(d.pl, d.trackId);
  if (!it) return;
  d.moved = true;
  if (!it.cut) it.cut = { start:0, end:t.dur };
  if (d.el === "hStart") it.cut.start = clamp(sec, 0, it.cut.end - 2);
  else                   it.cut.end   = clamp(sec, it.cut.start + 2, t.dur);
  if (d.scope === "player"){
    state.player.pos = clamp(state.player.pos, it.cut.start, it.cut.end);
    drawPlayerTimeline(); updatePlayerText();
  } else { drawSheetWave(); updateCutBoxes(); }

/* ══════════════════════════ Waveform zeichnen (geteilt) ═════════════════ */
function drawWave(canvas, w, h, trackId, s, pos){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,w,h);
  const t = track(trackId); if (!t) return;
  const css = getComputedStyle($("#phone"));
  const colOut = css.getPropertyValue("--wave-out").trim();
  const colIn  = css.getPropertyValue("--wave-in").trim();
  const data = waveData(trackId, Math.floor(w/3));
  const bw = 3, gap = 1, n = data.length;
  for (let i = 0; i < n; i++){
    const x = i*bw;
    const sec = (i*bw)/w * t.dur;
    const inCut = sec >= s.start && sec <= s.end;
    ctx.fillStyle = inCut ? colIn : colOut;
    const bh = data[i] * (h-8);
    ctx.fillRect(x, (h-bh)/2, bw-gap, bh);
  }
  /* dunkle Abblendung außerhalb des Schnitts */
  ctx.fillStyle = "rgba(0,0,0,.35)";
  if (s.start > 0) ctx.fillRect(0, 0, (s.start/t.dur)*w, h);
  if (s.end < t.dur) ctx.fillRect((s.end/t.dur)*w, 0, w - (s.end/t.dur)*w, h);
}

/* ══════════════════════════ Aktionen (data-act) ═════════════════════════ */
function handle(act, el){
  const ds = el.dataset;
  switch (act){
    case "theme":
      state.theme = state.theme === "dark" ? "light" : "dark";
      $("#phone").dataset.theme = state.theme; refreshCurrent(); break;
    case "back": back(); break;
    case "go-player": go("player"); break;
    case "go-about": go("about"); break;
    case "open-pl": state.ui.activePl = ds.pl; go("pl"); break;
    case "pl-sort": state.ui.plSort = ds.s; renderPlDetail(); break;
    case "play-track": playTrack(ds.t, "pl4"); break;
    case "play-in-pl": playTrack(ds.t, ds.pl); break;
    case "play-pl": { const p = playlist(ds.pl);
      if (!p.items.length){ toast(`„${p.name}“ ist leer – erst Titel hinzufügen`, true); break; }
      playTrack(p.items[0].id, ds.pl); break; }
    case "play-next": nextTrack(true); break;
    case "toggle-play": togglePlay(); break;
    case "next": nextTrack(true); break;
    case "prev": prevTrack(); break;
    case "tgl-shuffle": state.settings.shuffle = !state.settings.shuffle; refreshCurrent(); break;
    case "cycle-repeat": {
      const r = state.settings.repeat;
      state.settings.repeat = r === "all" ? "one" : r === "one" ? "off" : "all";
      refreshCurrent(); renderMini(); break;
    }
    case "seek-start": { const s = span(); if (s){ state.player.pos = s.start; renderMini(); refreshCurrent(); } break; }
    case "seek-end": { const s = span(); if (s){ state.player.pos = s.end - 0.1; renderMini(); refreshCurrent(); } break; }
    case "edit-cut": openCutEditor(ds.t, ds.pl || currentItem()?.pl?.id); break;
    case "track-menu": openTrackMenu(ds.t, ds.pl); break;
    case "add-to-pl": openAddToPl(ds.t); break;
    case "add-track": openAddToPl(null); break;
    case "pl-add": {
      const pl = playlist(ds.pl);
      if (!pl.items.some(i => i.id === ds.t)){
        pl.items.push({ id:ds.t, cut:null });
        toast(`➕ ${track(ds.t).title} → ${pl.name}`);
      }
      closeSheet(); refreshCurrent(); break;
    }
    case "cut-remove": { const it = itemOf(ds.pl, ds.t); if (it) it.cut = null; closeSheet(); toast("Schnitt entfernt – ganzer Titel"); refreshCurrent(); renderMini(); break; }
    case "pl-remove": { const pl = playlist(ds.pl); pl.items = pl.items.filter(i => i.id !== ds.t); closeSheet(); toast("Aus Playlist entfernt"); refreshCurrent(); break; }
    case "file-remove": closeSheet(); toast("Vom Gerät löschen: in echter App mit Sicherheitsabfrage", true); break;
    case "clear-cuts": {
      let n = 0; state.playlists.forEach(p => p.items.forEach(i => { if (i.cut){ i.cut = null; n++; } }));
      toast(`${n} Schnitte gelöscht`); refreshCurrent(); renderMini(); break;
    }
    case "tgl": state.settings[ds.k] = !state.settings[ds.k]; renderSet(); break;
    case "fade-step": state.settings.fade = +(state.settings.fade + .5 > 4 ? 0 : state.settings.fade + .5).toFixed(1);
      renderSet(); toast(`Blendzeit: ${state.settings.fade} s`); break;
    case "sleep": {
      const opts = [0, 15, 30, 45, 60];
      state.settings.sleepMin = opts[(opts.indexOf(state.settings.sleepMin)+1) % opts.length];
      renderSet(); toast(state.settings.sleepMin ? `Sleep-Timer: ${state.settings.sleepMin} min` : "Sleep-Timer aus"); break;
    }
    case "new-pl": openNewPl(); break;
    case "np-icon": state.ui.npIcon = ds.e;
      $$(".chip[data-act=np-icon]").forEach(c => c.classList.toggle("on", c.dataset.e === ds.e)); break;
    case "np-create": {
      const name = ($("#npName")?.value || "").trim() || "Neue Playlist";
      const id = "pl" + (state.playlists.length + 1);
      state.playlists.push({ id, name, cover:state.ui.npIcon || "🎧", items:[] });
      closeSheet(); toast(`Playlist „${name}“ angelegt`); renderPlaylists(); break;
    }
    case "import": {
      state.ui.importing = true; state.ui.importPct = 0; renderLibrary();
      const iv = setInterval(() => {
        state.ui.importPct = Math.min(100, state.ui.importPct + 20);
        if ($("#s-library").classList.contains("active")) renderLibrary();
        if (state.ui.importPct >= 100){ clearInterval(iv);
          state.ui.importing = false; setTimeout(() => { if (state.screen==="library") renderLibrary(); toast("3 Dateien importiert (14,2 MB)"); }, 400); }
      }, 350);
      break;
    }
    case "fab-cut": {
      const cur = state.player.trackId;
      const target = cur || (state.ui.activePl ? playlist(state.ui.activePl)?.items[0]?.id : null) || state.tracks[0].id;
      openCutEditor(target, currentItem()?.pl?.id || state.ui.activePl);
      break;
    }
    case "sheet-close": closeSheet(); refreshCurrent(); break;
    case "cut-save": {
      const it = itemOf(state.ui.editPl, state.ui.editTrack);
      closeSheet(); toast(`✂ Schnitt gespeichert: ${mmssPrecise(it.cut.start)}–${mmssPrecise(it.cut.end)}`);
      refreshCurrent(); renderMini(); break;
    }
    case "cut-reset": {
      const it = itemOf(state.ui.editPl, state.ui.editTrack);
      const t = track(state.ui.editTrack);
      it.cut = { start:0, end:t.dur };
      drawSheetWave(); toast("Schnitt zurückgesetzt (ganzer Titel)"); break;
    }
    case "cut-play": {
      const it = itemOf(state.ui.editPl, state.ui.editTrack);
      state.player.trackId = state.ui.editTrack;
      state.playQueue = playlist(state.ui.editPl).items.map(i => i.id);
      state.qIndex = state.playQueue.indexOf(state.ui.editTrack);
      state.player.pos = it.cut.start; state.player.playing = true;
      renderMini(); break;
    }
    case "nudge": {
      const it = itemOf(state.ui.editPl, state.ui.editTrack);
      const t = track(state.ui.editTrack);
      const d = +ds.d;
      const focus = state.ui.nudgeFocus || "end";
      if (focus === "start") it.cut.start = clamp(it.cut.start + d, 0, it.cut.end - 2);
      else it.cut.end = clamp(it.cut.end + d, it.cut.start + 2, t.dur);
      drawSheetWave(); break;
    }
    case "nudge-s": state.ui.nudgeFocus = state.ui.nudgeFocus === "start" ? "end" : "start";
      toast(`Feinjustage: ${state.ui.nudgeFocus === "start" ? "Startmarke" : "Endmarke"}`); break;
  }
}

/* ══════════════════════════ Event-Delegation ════════════════════════════ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (state.ui.drag || state.ui.dragged) return;   /* nach Griffe-Ziehen kein Klick auslösen */
  const act = el.dataset.act;
  e.stopPropagation();
  handle(act, el);
});
/* Klick ins Sheet-Overlay schließt */
$("#sheet").addEventListener("pointerdown", e => {
  if (!e.target.closest(".handle")) state.ui.nudgeFocus = state.ui.nudgeFocus || "end";
});

/* ══════════════════════════ Init ════════════════════════════════════════ */
function tick(){ $("#clock").textContent = clockStr(); }
tick(); setInterval(tick, 20000);
renderHome();
</script>
